<title>Keel Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: ink-on-graph-paper planner. Fixed left rail (bottom bar on phones), sticky capture bar, views below; detail opens in a right drawer. */
:root {
  --bg: #eef1f6; --surface: #ffffff; --sunk: #e5e9f1; --ink: #131926; --muted: #586176; --line: #d7dce7;
  --accent: #2b47c8; --accent-ink: #ffffff; --accent-soft: #e2e7fb; --hi: #fde68a;
  --ok: #17734b; --ok-soft: #dbf2e6; --warn: #9a5806; --warn-soft: #fbebd0; --bad: #bd3328; --bad-soft: #fbe0dc;
  --grid: rgba(43, 71, 200, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --shadow: 0 10px 30px rgba(19, 25, 38, .14);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e121a; --surface: #161b26; --sunk: #1d2331; --ink: #e6eaf2; --muted: #9aa3b6; --line: #2a3244;
  --accent: #8fa3ff; --accent-ink: #0e121a; --accent-soft: #222b4f; --hi: #5e4f12;
  --ok: #52c993; --ok-soft: #14302a; --warn: #e8a94b; --warn-soft: #352a14; --bad: #f2776c; --bad-soft: #3b1e1e;
  --grid: rgba(143, 163, 255, .05); --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e121a; --surface: #161b26; --sunk: #1d2331; --ink: #e6eaf2; --muted: #9aa3b6; --line: #2a3244;
  --accent: #8fa3ff; --accent-ink: #0e121a; --accent-soft: #222b4f; --hi: #5e4f12;
  --ok: #52c993; --ok-soft: #14302a; --warn: #e8a94b; --warn-soft: #352a14; --bad: #f2776c; --bad-soft: #3b1e1e;
  --grid: rgba(143, 163, 255, .05); --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 18px;
  padding-block: 22px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px;
  border-right: 1px solid var(--line); background: var(--surface);
}
.brand { display: flex; align-items: baseline; gap: 8px; padding-inline: 8px; }
.brand b { font: 800 26px/1 var(--f-display); letter-spacing: -.02em; }
.brand span { font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; text-align: left; color: var(--muted);
}
.nav button:hover { background: var(--sunk); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.nav button[aria-current="page"] svg { color: var(--accent); }
.nav .lbl { flex: 1; }
.nav .ct { font: 600 11px var(--f-mono); color: var(--muted); }
.nav .ct.bad { color: var(--bad); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-inline: 8px; font-size: 12px; color: var(--muted); }
.sync { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); text-align: left; font-size: 13px; }
.linkbtn:hover { text-decoration: underline; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.main { min-width: 0; }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.wrap { max-width: 1120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar .wrap { padding-block: 12px; display: flex; flex-direction: column; gap: 6px; }
.qa { display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 4px 4px 4px 12px; }
.qa:focus-within { border-color: var(--accent); }
.qa input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding: 8px 0; font-size: 16px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 12px; font-size: 14px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--sunk); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.qa-hint { display: flex; flex-wrap: wrap; gap: 6px; min-height: 22px; font-size: 12.5px; color: var(--muted); align-items: center; }

.view { padding-block: 22px 120px; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.head h1 { margin: 0; font: 800 clamp(28px, 4vw, 38px)/1.05 var(--f-display); letter-spacing: -.025em; text-wrap: balance; }
.head .sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
.eyebrow { font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h2, .sec h2 { margin: 0; font: 700 17px/1.2 var(--f-display); display: flex; align-items: center; gap: 8px; }
.panel h2 .n, .sec h2 .n { font: 600 12px var(--f-mono); color: var(--muted); }
.sec { display: flex; flex-direction: column; gap: 6px; }
.sec + .sec { margin-top: 10px; }
.sec h2.bad { color: var(--bad); }
.empty { color: var(--muted); font-size: 14px; padding: 8px 10px; border: 1px dashed var(--line); border-radius: 10px; }

ul.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.task { display: flex; align-items: flex-start; gap: 10px; padding: 8px 8px; border-radius: 9px; }
.task:hover { background: var(--sunk); }
.check {
  width: 20px; height: 20px; margin-top: 1px; flex: none; border: 2px solid var(--muted); border-radius: 6px; background: transparent; padding: 0; position: relative;
}
.check:hover { border-color: var(--accent); }
.task.done .check { background: var(--accent); border-color: var(--accent); }
.task.done .check::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.task.blocked .check { border-color: var(--bad); border-style: dashed; }
.tbody { flex: 1; min-width: 0; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.ttitle {
  overflow-wrap: anywhere; background-image: linear-gradient(var(--accent), var(--accent)); background-repeat: no-repeat; background-position: 0 58%; background-size: 0% 2px;
  transition: background-size .35s ease, color .35s;
}
.task.done .ttitle { background-size: 100% 2px; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; font: 500 11.5px/1.6 var(--f-mono); padding: 0 7px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip svg.i { width: 12px; height: 12px; }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chip.ex { background: var(--hi); color: var(--ink); }
.chip .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.row-act { opacity: 0; border: 0; background: none; color: var(--muted); padding: 2px; border-radius: 6px; }
.task:hover .row-act, .row-act:focus-visible { opacity: 1; }
.row-act:hover { color: var(--accent); }
@media (hover: none) { .row-act { opacity: .7; } }

.ring { display: flex; align-items: center; gap: 14px; }
.ring svg { width: 74px; height: 74px; flex: none; }
.ring b { font: 800 26px/1 var(--f-display); }
.stat-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--sunk); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font: 700 20px/1.1 var(--f-mono); }
.stat span { font-size: 12px; color: var(--muted); }
.stat.bad b { color: var(--bad); }

textarea.note-in, .field textarea { width: 100%; min-height: 84px; resize: vertical; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; outline: 0; line-height: 1.5; }
textarea.note-in:focus, .field textarea:focus { border-color: var(--accent); }
.note { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; display: flex; flex-direction: column; gap: 4px; }
.note.pinned { border-left-color: var(--accent); }
.note .nb { white-space: pre-wrap; overflow-wrap: anywhere; cursor: pointer; }
.note .nb .tag { color: var(--accent); font-weight: 700; }
.note .nm { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.note-day { font: 600 12px var(--f-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 8px; }

.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--sunk); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 220px; border: 2px solid transparent; }
.col.over { border-color: var(--accent); }
.col h3 { margin: 0; padding: 2px 4px 4px; font: 700 14px var(--f-display); display: flex; align-items: center; gap: 8px; }
.col h3 .n { font: 600 12px var(--f-mono); color: var(--muted); margin-left: auto; }
.col h3 .sw { width: 10px; height: 10px; border-radius: 3px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; cursor: grab; }
.card:hover { border-color: var(--muted); }
.card.dragging { opacity: .5; }
.card.done .ttitle { background-size: 100% 2px; color: var(--muted); }
.card .ttitle { font-weight: 700; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar input[type="search"], .toolbar select, .field input, .field select {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 10px; outline: 0; min-width: 0;
}
.toolbar input[type="search"]:focus, .field input:focus, .field select:focus { border-color: var(--accent); }

.goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; border-top: 5px solid var(--gc, var(--accent)); }
.goal h3 { margin: 0; font: 700 19px/1.2 var(--f-display); cursor: pointer; text-wrap: balance; }
.goal h3:hover { color: var(--accent); }
.goal .why { font-size: 13.5px; color: var(--muted); margin: 0; }
.prog { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--gc, var(--accent)); border-radius: 99px; }
.goal .gline { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.inline-add { display: flex; gap: 6px; }
.inline-add input { flex: 1; min-width: 0; border: 1.5px dashed var(--line); background: none; border-radius: 9px; padding: 6px 10px; outline: 0; font-size: 14px; }
.inline-add input:focus { border-style: solid; border-color: var(--accent); }

.review-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.big-num { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.big-num div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.big-num b { display: block; font: 700 28px/1.1 var(--f-mono); }
.big-num span { font-size: 12.5px; color: var(--muted); }
.big-num .ok b { color: var(--ok); } .big-num .bad b { color: var(--bad); } .big-num .warn b { color: var(--warn); }
.chart { width: 100%; max-width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--f-mono); }
.coach { white-space: pre-wrap; font-size: 14.5px; line-height: 1.55; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label, .field > .lb { font: 600 11.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.fields2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13px; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.seg button.sw-btn { width: 28px; height: 28px; padding: 0; border-radius: 8px; }

#scrim { position: fixed; inset: 0; background: rgba(10, 14, 22, .35); z-index: 20; }
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 21; width: min(480px, 100%); background: var(--surface); box-shadow: var(--shadow);
  padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));
  overflow-y: auto; display: flex; flex-direction: column; gap: 16px; border-left: 1px solid var(--line);
}
#drawer .dh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.title-in { width: 100%; border: 0; border-bottom: 2px solid var(--line); background: none; font: 700 22px/1.25 var(--f-display); padding: 4px 0 6px; outline: 0; }
.title-in:focus { border-color: var(--accent); }
.subs { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.subs li { display: flex; gap: 8px; align-items: center; }
.subs li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.subs li.d span { text-decoration: line-through; text-decoration-color: var(--accent); text-decoration-thickness: 2px; color: var(--muted); }
.subs input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

#toasts {
  position: fixed; z-index: 30; display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); max-width: min(420px, calc(100% - 32px));
}
.toast { background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 12px 10px 14px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; animation: rise .25s ease; }
.toast .tmsg { flex: 1 1 180px; min-width: 0; overflow-wrap: anywhere; }
.toast .tmsg b { display: block; }
.toast button { border: 0; background: color-mix(in srgb, var(--bg) 18%, transparent); color: var(--bg); border-radius: 7px; padding: 4px 9px; font-size: 13px; font-weight: 700; }
.toast.rem { border-left: 4px solid var(--hi); }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

#timer {
  position: fixed; z-index: 15; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 6px 6px 6px 16px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow); max-width: calc(100% - 32px);
}
#timer .tt { font: 700 16px var(--f-mono); }
#timer .tn { font-size: 13px; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#timer button { border: 0; background: color-mix(in srgb, var(--accent-ink) 20%, transparent); color: var(--accent-ink); border-radius: 99px; padding: 5px 11px; font-size: 13px; font-weight: 700; }

.welcome { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.welcome h2 { margin: 0; font: 800 24px/1.15 var(--f-display); }
.welcome ul { margin: 0; padding-left: 20px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
kbd { font: 600 11.5px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--sunk); }
.loading { padding: 40px 0; color: var(--muted); }

.mob-settings { display: none !important; }
@media (max-width: 980px) {
  .cols, .review-grid { grid-template-columns: minmax(0, 1fr); }
  .big-num { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 12; flex-direction: row; gap: 0; border-right: 0; border-top: 1px solid var(--line);
    padding-block: 4px calc(4px + env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  }
  .brand, .side-foot .sync { display: none; }
  .nav { flex-direction: row; flex: 1; justify-content: space-around; }
  .nav button { flex-direction: column; gap: 2px; padding: 6px 4px; font-size: 11px; flex: 1; align-items: center; }
  .nav .ct { display: none; }
  .side-foot { margin: 0; justify-content: center; padding: 0; }
  .side-foot .linkbtn { display: none; }
  .mob-settings { display: inline-flex !important; }
  #toasts, #timer { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .fields2 { grid-template-columns: minmax(0, 1fr); }
  input, select, textarea { font-size: 16px !important; }
  .board { grid-template-columns: repeat(4, minmax(240px, 82vw)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <nav class="side" aria-label="Sections">
    <div class="brand"><b>Keel</b><span>stay on course</span></div>
    <div class="nav" id="nav">
      <button data-act="nav" data-v="today"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="lbl">Today</span><span class="ct" id="ct-today"></span></button>

// ---------- storage: claude.ai account store when available, browser storage otherwise ----------
const LS_KEY = "keel.v1";
const caps = { sample: null, downloads: null };
const Store = {
  items: new Map(), mode: "loading", col: null, dirty: new Set(), timers: new Map(), chains: new Map(), lsTimer: null, onChange: () => {},

  get(id) { return this.items.get(id); },
  put(it) { it.updated = Date.now(); this.items.set(it.id, it); this.save(it.id); this.onChange(); },
  remove(id) { this.items.delete(id); this.save(id); this.onChange(); },
  save(id) {

  async writeNow(id) {

function setSync(kind, text) {

}
function syncError(e) {

  else if (code === "revoked") toast("This page lost access to your saved data. Reload to reconnect.");

async function boot() {

// ---------- domain ----------

function newTask(fields) {

    goalId: null, notes: "", blockedReason: "", subtasks: [], created: Date.now(), doneAt: null, focus: {} }, fields);

// ---------- quick add parsing ----------
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "");
function parseQuick(text, defaultToday) {
  let t = " " + text + " ";
  const out = { priority: "med", due: null, remind: null, repeat: "none", goalId: null };
  t = t.replace(/\s!(high|h|urgent|1)(?=\s)/i, () => { out.priority = "high"; return " "; });

  t = t.replace(/\s(tomorrow|tmrw|tmr)(?=\s)/i, () => { out.due = addDays(t0, 1); return " "; });
  t = t.replace(/\s(next week)(?=\s)/i, () => { out.due = addDays(weekStart(t0), 7); return " "; });
  t = t.replace(/\sin (\d{1,3}) days?(?=\s)/i, (m, n) => { out.due = addDays(t0, +n); return " "; });
  t = t.replace(/\s(\d{4}-\d{2}-\d{2})(?=\s)/, (m, d) => { out.due = d; return " "; });
  t = t.replace(/\s(?:on\s)?(mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun)(?:day|nesday|urday|sday)?(?=\s)/i, (m, d) => {
    const idx = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"].indexOf(d.toLowerCase().slice(0, 3));
    let n = 1; while (parseDay(addDays(t0, n)).getDay() !== idx) n++;
    out.due = addDays(t0, n); return " ";
  });
  t = t.replace(/\s(?:at\s)?(\d{1,2})(?::(\d{2}))?\s?(am|pm)(?=\s)/i, (m, h, mm, ap) => {
    h = +h % 12 + (ap.toLowerCase() === "pm" ? 12 : 0); out._time = pad(h) + ":" + (mm || "00"); return " ";

}

}

  if (t.example) chips.push('<span class="chip ex">Example</span>');
  if (t.status === "doing") chips.push('<span class="chip acc">In progress</span>');
  if (t.status === "blocked") chips.push(`<span class="chip bad">${IC.block}Blocked${t.blockedReason ? ": " + esc(t.blockedReason) : ""}</span>`);
  if (t.priority === "high" && isOpen(t)) chips.push('<span class="chip bad">High</span>');
  if (t.priority === "low" && isOpen(t)) chips.push('<span class="chip">Low</span>');
  if (t.due && !o.hideDue) {
    const late = isOpen(t) && t.due < t0;
    chips.push(`<span class="chip ${late ? "bad" : t.due === t0 ? "warn" : ""}">${IC.cal}${late ? daysBetween(t.due, t0) + "d late" : fmtDay(t.due)}</span>`);
  }
  if (t.remind && isOpen(t)) chips.push(`<span class="chip">${IC.bell}${t.remind.slice(0, 10) === t0 ? fmtTime(t.remind) : fmtShort(t.remind.slice(0, 10)) + " " + fmtTime(t.remind)}</span>`);
  if (t.repeat && t.repeat !== "none") chips.push(`<span class="chip">${IC.rep}${REPEAT[t.repeat].replace("Every ", "")}</span>`);
  if (t.subtasks && t.subtasks.length) chips.push(`<span class="chip">${IC.list}${t.subtasks.filter(s => s.done).length}/${t.subtasks.length}</span>`);
  if (g && !o.hideGoal) chips.push(`<span class="chip"><i class="sw" style="background:${esc(g.color)}"></i>${esc(g.title)}</span>`);
  const fm = Object.values(t.focus || {}).reduce((a, b) => a + b, 0);
  if (fm) chips.push(`<span class="chip">${IC.clock}${fmtMin(fm)}</span>`);
  return `<li class="task ${t.status}" data-id="${t.id}">
    <button class="check" data-act="toggle" aria-label="${t.status === "done" ? "Mark as not done" : "Mark as done"}: ${esc(t.title)}"></button>
    <div class="tbody" data-act="open-task"><span><span class="ttitle">${esc(t.title)}</span></span>${chips.length ? `<span class="meta">${chips.join("")}</span>` : ""}</div>
    ${isOpen(t) ? `<button class="row-act" data-act="focus" title="Start a 25-minute focus session" aria-label="Focus on ${esc(t.title)}">${IC.play}</button>` : ""}
  </li>`;
}
const taskList = (ts, o) => ts.length ? `<ul class="tasks">${ts.map(t => taskRow(t, o)).join("")}</ul>` : "";

function ringSVG(p) {
  const r = 30, c = 2 * Math.PI * r;
  return `<svg viewBox="0 0 74 74" aria-hidden="true"><circle cx="37" cy="37" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="8"/>
    <circle cx="37" cy="37" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 37 37)"/></svg>`;
}

function noteBody(s) {
  return esc(s).replace(/(^|\s)#([\w-]+)/g, '$1<span class="tag">#$2</span>');
}
function noteItem(n) {
  const d = new Date(n.created);
  return `<div class="note ${n.pinned ? "pinned" : ""}" data-id="${n.id}">
    <div class="nb" data-act="open-note">${noteBody(n.body)}</div>
    <div class="nm"><span class="mono">${fmtTime(d)}</span>${n.example ? '<span class="chip ex">Example</span>' : ""}
      <button class="btn ghost sm" data-act="note-pin">${n.pinned ? "Unpin" : "Pin"}</button>
      <button class="btn ghost sm" data-act="note-task">Make a task</button>
      <button class="btn ghost sm danger" data-act="note-del">Delete</button></div>
  </div>`;
}

// ---------- views ----------
const VIEWS = {
  today() {
    const t0 = today(), d = new Date(), ts = tasks();
    if (!Store.items.size) return welcome();
    const overdue = ts.filter(t => isOpen(t) && t.due && t.due < t0).sort(byPri);
    const todays = ts.filter(t => t.due === t0 && (isOpen(t) || doneDay(t) === t0) || (doneDay(t) === t0 && t.due !== t0) || (t.status === "doing" && (!t.due || t.due > t0))).sort(byPri);
    const soon = ts.filter(t => isOpen(t) && t.status !== "doing" && t.due && t.due > t0 && t.due <= addDays(t0, 7)).sort((a, b) => a.due.localeCompare(b.due) || byPri(a, b));
    const any = ts.filter(t => isOpen(t) && t.status !== "doing" && !t.due).sort(byPri);
    const doneToday = ts.filter(t => doneDay(t) === t0).length;
    const planned = doneToday + todays.filter(isOpen).length + overdue.length;
    const pct = planned ? doneToday / planned : 0;
    const blocked = ts.filter(t => t.status === "blocked").length;
    const next = [...overdue, ...todays.filter(isOpen)].find(t => t.status !== "blocked");
    const todayNotes = notes().filter(n => n.day === t0);
    const pinned = notes().filter(n => n.pinned && n.day !== t0).slice(0, 3);
    const hr = d.getHours(), greet = hr < 12 ? "Good morning" : hr < 18 ? "Good afternoon" : "Good evening";
    const anyShown = state.showAnyAll ? any : any.slice(0, 6);
    return `
    <div class="head"><div><div class="eyebrow">${DOWL[d.getDay()]} · ${fmtShort(t0)} · Week ${isoWeek(d)}</div><h1>${greet}.</h1>
      <div class="sub">${planned ? `${doneToday} of ${planned} things for today are crossed off.` : "Nothing is planned for today yet. Add a task above or pull one in from Anytime."}</div></div>
      ${ts.some(t => t.example) || notes().some(n => n.example) ? '<button class="btn sm" data-act="clear-examples">Remove example data</button>' : ""}</div>
    <div class="cols">
      <div class="panel">
        ${overdue.length ? `<div class="sec"><h2 class="bad">Overdue <span class="n">${overdue.length}</span></h2>${taskList(overdue)}</div>` : ""}
        <div class="sec"><h2>Today <span class="n">${todays.filter(isOpen).length} open</span></h2>${taskList(todays, { hideDue: true }) || '<div class="empty">No tasks due today. Type one above; it lands here by default.</div>'}</div>
        ${soon.length ? `<div class="sec"><h2>Next 7 days <span class="n">${soon.length}</span></h2>${taskList(soon)}</div>` : ""}
        ${any.length ? `<div class="sec"><h2>Anytime <span class="n">${any.length}</span></h2>${taskList(anyShown)}${any.length > 6 ? `<button class="linkbtn" data-act="any-all">${state.showAnyAll ? "Show fewer" : "Show all " + any.length}</button>` : ""}</div>` : ""}

          <div class="stat-row">

  board() {

        ${t.subtasks && t.subtasks.length ? `<span class="chip">${IC.list}${t.subtasks.filter(s => s.done).length}/${t.subtasks.length}</span>` : ""}

    }).join("")}</div>` : `<div class="welcome"><h2>Set your first milestone</h2><p class="muted" style="margin:0">A goal is a bigger outcome, like “Launch portfolio site” or “Pass the AWS exam”. Give it a target date, add its tasks, and Keel tracks progress and warns you when it falls behind.</p><div><button class="btn primary" data-act="new-goal">New goal</button></div></div>`}
    ${Store.all("goal").some(g => g.archived) ? `<details><summary class="muted">Archived goals</summary><ul>${Store.all("goal").filter(g => g.archived).map(g => `<li data-goal="${g.id}"><button class="linkbtn" data-act="open-goal">${esc(g.title)}</button></li>`).join("")}</ul></details>` : ""}`;

    <div class="head"><div><div class="eyebrow">Journal</div><h1>Notes</h1><div class="sub">Thoughts as they come. Use <span class="mono">#tags</span>, pin the important ones, turn any note into a task.</div></div></div>
    <div class="panel">

    </div>

  },

  review() {
    const ws = state.week, we = addDays(ws, 6), t0 = today(), ts = tasks();
    const inWk = d => d && d >= ws && d <= we;
    const done = ts.filter(t => inWk(doneDay(t))).sort((a, b) => a.doneAt - b.doneAt);
    const left = ts.filter(t => (t.status === "todo" || t.status === "doing") && t.due && t.due <= we).sort((a, b) => a.due.localeCompare(b.due));
    const blocked = ts.filter(t => t.status === "blocked");
    const undated = ts.filter(t => (t.status === "todo" || t.status === "doing") && !t.due).length;
    const rate = done.length + left.length ? Math.round(done.length / (done.length + left.length) * 100) : 0;
    let focus = 0; for (let i = 0; i < 7; i++) focus += focusOn(addDays(ws, i));
    const perDay = [...Array(7)].map((_, i) => done.filter(t => doneDay(t) === addDays(ws, i)).length);
    const wkNotes = notes().filter(n => inWk(n.day)).length;

    const gs = goals();
    const coach = state.coach[ws];
    return `
    <div class="head"><div><div class="eyebrow">Week ${isoWeek(parseDay(ws))} · ${fmtShort(ws)} – ${fmtShort(we)}</div><h1>${isCur ? "This week" : "Week review"}</h1>
      <div class="sub">${isCur ? "Sunday evening is a good time to look back and set next week's focus." : "A look back at a past week."}</div></div>
      <div class="toolbar"><button class="btn sm" data-act="week-prev" aria-label="Previous week">‹ Prev</button>${isCur ? "" : '<button class="btn sm" data-act="week-now">This week</button>'}<button class="btn sm" data-act="week-next" aria-label="Next week" ${isCur ? "disabled" : ""}>Next ›</button>

    <div class="big-num">

    <div class="cols">
      <div class="panel"><h2>Crossed off per day</h2>${weekChart(perDay, ws)}
        ${gs.length ? `<div class="eyebrow" style="margin-top:6px">Goals</div>${gs.map(g => { const s = goalStats(g), [hc, hl] = HEALTH[s.health]; const wd = done.filter(t => t.goalId === g.id).length;
          return `<div style="display:flex;flex-direction:column;gap:4px;--gc:${esc(g.color)}"><div class="gline" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(g.title)}</b><span class="chip ${hc}">${hl}</span></div><div class="prog"><i style="width:${(s.pct * 100).toFixed(1)}%"></i></div><span class="muted mono" style="font-size:12px">${s.done}/${s.total} total · +${wd} this week</span></div>`; }).join("")}` : ""}
        <span class="muted" style="font-size:13px">${wkNotes} note${wkNotes === 1 ? "" : "s"} written this week.</span>
      </div>
      <div class="panel"><h2>Reflection</h2>
        <div class="field"><label for="rv-wins-${ws}">What went well</label><textarea id="rv-wins-${ws}" data-rv="wins" data-week="${ws}" placeholder="Wins, big or small">${esc(rv.wins)}</textarea></div>
        <div class="field"><label for="rv-blockers-${ws}">What got in the way</label><textarea id="rv-blockers-${ws}" data-rv="blockers" data-week="${ws}" placeholder="Blockers, distractions, surprises">${esc(rv.blockers)}</textarea></div>
        <div class="field"><label for="rv-next-${ws}">Focus for next week</label><textarea id="rv-next-${ws}" data-rv="next" data-week="${ws}" placeholder="The 1–3 things that matter most">${esc(rv.next)}</textarea></div>
        ${caps.sample ? `<div class="sec"><button class="btn" data-act="ai-coach" ${coach && coach.busy ? "disabled" : ""}>${IC.spark}${coach && coach.busy ? "Thinking…" : "Get a coaching summary from Claude"}</button>${coach && coach.text ? `<div class="coach">${esc(coach.text)}</div>` : ""}</div>` : ""}
      </div>
    </div>`;
  },

function weekChart(vals, ws) {
  const W = 340, H = 150, padL = 26, padB = 22, padT = 12, max = Math.max(4, ...vals);
  const top = Math.ceil(max / 2) * 2, bw = (W - padL - 8) / 7;
  const y = v => H - padB - (v / top) * (H - padB - padT);
  const t0 = today();
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tasks completed each day: ${vals.join(", ")}">`;
  [0, top / 2, top].forEach(v => { s += `<line x1="${padL}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; });
  vals.forEach((v, i) => {
    const x = padL + i * bw + bw * 0.18, w = bw * 0.64, d = addDays(ws, i);
    if (v) s += `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${(H - padB - y(v)).toFixed(1)}" rx="4" fill="var(--accent)"/><text x="${(x + w / 2).toFixed(1)}" y="${(y(v) - 4).toFixed(1)}" text-anchor="middle" style="fill:var(--ink)">${v}</text>`;
    s += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" style="${d === t0 ? "fill:var(--accent);font-weight:600" : ""}">${DOW[parseDay(d).getDay()]}</text>`;
  });
  return s + "</svg>";
}

// ---------- quick add ----------
function renderHint() {
  const v = $("#qa").value.trim(), h = $("#qa-hint");
  if (!v) { h.innerHTML = `<span>Understands <span class="mono">today · tomorrow · fri · 5pm · !high · #goal · every day</span></span>`; return; }
  const p = parseQuick(v, state.view === "today");
  const g = p.goalId && Store.get(p.goalId);

// ---------- board drag & drop ----------
let dragMoved = false;
function bindBoard() {
  document.querySelectorAll(".card").forEach(c => {
    c.addEventListener("dragstart", ev => { dragMoved = true; c.classList.add("dragging"); ev.dataTransfer.setData("text/plain", c.dataset.id); ev.dataTransfer.effectAllowed = "move"; });
    c.addEventListener("dragend", () => { c.classList.remove("dragging"); setTimeout(() => { dragMoved = false; }, 50); });
  });
  document.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", ev => { ev.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", ev => { if (!col.contains(ev.relatedTarget)) col.classList.remove("over"); });
    col.addEventListener("drop", ev => {
      ev.preventDefault(); col.classList.remove("over");
      const t = Store.get(ev.dataTransfer.getData("text/plain")); if (!t) return;
      setStatus(t, col.dataset.status);
      if (t.status === "blocked" && !t.blockedReason) openTask(t.id);
    });
  });
}

// ---------- reminders ----------
function checkReminders(onOpen) {
  const now = Date.now(), due = tasks().filter(t => t.remind && !t.reminded && isOpen(t) && new Date(t.remind).getTime() <= now);
  if (!due.length) return;
  const stale = due.filter(t => now - new Date(t.remind).getTime() > 3600e3), fresh = due.filter(t => !stale.includes(t));
  fresh.forEach(t => fireReminder(t));
  if (stale.length) toast(`<b>${stale.length} reminder${stale.length > 1 ? "s" : ""} went off while Keel was closed</b>${stale.slice(0, 3).map(t => esc(t.title)).join(" · ")}`, [{ label: "Show", fn: () => go("today") }], { html: true, sticky: true, cls: "rem" });
  if (fresh.length) chime();
  Store.bulk(due.map(t => (t.reminded = true, t)));
}
function fireReminder(t, test) {
  const acts = test ? [] : [
    { label: "Done", fn: () => { const x = Store.get(t.id); if (x) setStatus(x, "done"); } },
    { label: "Snooze 15m", fn: () => { const x = Store.get(t.id); if (!x) return; x.remind = localDT(new Date(Date.now() + 15 * 6e4)); x.reminded = false; Store.put(x); toast("Snoozed until " + fmtTime(x.remind) + "."); } },
    { label: "Open", fn: () => openTask(t.id) }];
  toast(`<b>Reminder</b>${esc(t.title)}`, acts, { html: true, sticky: !test, cls: "rem" });
  notify("Keel reminder", t.title, t.id || "test");
}
setInterval(() => { if (booted) checkReminders(); }, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && booted) { checkReminders(); scheduleRender(); } });
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); state.week = weekStart(lastDay); scheduleRender(); } }, 60000);

function gcalUrl(t) {
  let dates;
  if (t.remind) { const e = new Date(t.remind); e.setMinutes(e.getMinutes() + 30); dates = t.remind.replace(/[-:]/g, "") + "00/" + localDT(e).replace(/[-:]/g, "") + "00"; }
  else if (t.due) dates = t.due.replace(/-/g, "") + "/" + addDays(t.due, 1).replace(/-/g, "");
  else return null;
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(t.title) + "&dates=" + dates + "&details=" + encodeURIComponent((t.notes || "") + "\n\nFrom Keel");
}
function exportICS() {
  const list = tasks().filter(t => isOpen(t) && (t.remind || t.due) && (t.due || t.remind.slice(0, 10)) >= addDays(today(), -1));
  if (!list.length) { toast("No upcoming tasks have a date or reminder yet."); return; }
  const icsEsc = s => String(s).replace(/\\/g, "\\\\").replace(/[,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const rr = { daily: "FREQ=DAILY", weekly: "FREQ=WEEKLY", weekdays: "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR" };
  const ev = list.map(t => {
    const L = ["BEGIN:VEVENT", "UID:" + t.id + "@keel", "DTSTAMP:" + stamp, "SUMMARY:" + icsEsc(t.title)];
    if (t.remind) L.push("DTSTART:" + t.remind.replace(/[-:]/g, "") + "00", "DURATION:PT30M");
    else L.push("DTSTART;VALUE=DATE:" + t.due.replace(/-/g, ""), "DTEND;VALUE=DATE:" + addDays(t.due, 1).replace(/-/g, ""));
    if (t.notes) L.push("DESCRIPTION:" + icsEsc(t.notes));
    if (rr[t.repeat]) L.push("RRULE:" + rr[t.repeat]);
    L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(t.title), "TRIGGER" + (t.remind ? ":PT0M" : ":PT9H"), "END:VALARM", "END:VEVENT");
    return L.join("\r\n");
  });
  saveFile("keel-reminders.ics", ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Keel Planner//EN", "CALSCALE:GREGORIAN", ...ev, "END:VCALENDAR"].join("\r\n"), "text/calendar");
}
async function saveFile(name, data, type) {
  if (caps.downloads) {
    try { await caps.downloads.save({ filename: name, data }); toast("Saved " + name + "."); }
    catch (e) { if (!e || e.code !== "declined") toast("Couldn't save the file (" + ((e && e.code) || "error") + "). Try again in a moment."); }
    return;
  }
  if (window.claude) { toast("Saving files isn't available in this view. Open Keel from your own copy to download backups."); return; }
  const url = URL.createObjectURL(new Blob([data], { type }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

// ---------- focus timer ----------
let timer = null;
try { const raw = lsGet("keel.timer"); if (raw) { const x = JSON.parse(raw); if (x && x.endsAt > Date.now()) timer = x; } } catch {}
function startFocus(id) {
  const t = Store.get(id); if (!t) return;
  timer = { id, title: t.title, mins: 25, endsAt: Date.now() + 25 * 6e4 };
  lsSet("keel.timer", JSON.stringify(timer));
  if (t.status === "todo") setStatus(t, "doing");
  if (state.drawer) closeDrawer();
  renderTimer(); toast("Focus for 25 minutes on “" + t.title + "”. Phone away.");
}
function stopFocus(finished) {
  if (!timer) return;
  const mins = finished ? timer.mins : Math.floor((Date.now() - (timer.endsAt - timer.mins * 6e4)) / 6e4);
  const t = Store.get(timer.id);
  if (t && mins > 0) { t.focus = t.focus || {}; t.focus[today()] = (t.focus[today()] || 0) + mins; Store.put(t); }
  if (finished) {
    chime(); const tid = timer.id;
    toast(`<b>Focus session done</b>${mins} minutes on ${esc(timer.title)}. Take a 5-minute break.`, [
      { label: "Cross it off", fn: () => { const x = Store.get(tid); if (x) setStatus(x, "done"); } },
      { label: "Another 25", fn: () => startFocus(tid) }], { html: true, sticky: true, cls: "rem" });
    notify("Focus session done", timer.title, "focus");
  }
  timer = null; lsSet("keel.timer", ""); renderTimer();
}
function renderTimer() {
  const el = $("#timer");
  if (!timer) { el.hidden = true; return; }
  const left = Math.max(0, timer.endsAt - Date.now()), m = Math.floor(left / 6e4), s = Math.floor(left % 6e4 / 1000);
  el.hidden = false;
  el.innerHTML = `<span class="tt">${pad(m)}:${pad(s)}</span><span class="tn">${esc(timer.title)}</span><button data-act="timer-stop">Stop</button>`;
}
ACTIONS["timer-stop"] = () => stopFocus(false);
setInterval(() => { if (!timer) return; if (Date.now() >= timer.endsAt) stopFocus(true); else renderTimer(); }, 1000);
function focusOn(day) { return tasks().reduce((a, t) => a + ((t.focus || {})[day] || 0), 0); }

// ---------- sound ----------
let actx = null;
function chime(soft) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notesHz = soft ? [880] : [660, 880, 1100];
    notesHz.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + i * 0.13;
      o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(soft ? 0.05 : 0.12, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + 0.4);
    });
  } catch {}
}

// ---------- toasts / clipboard ----------
function toast(msg, actions = [], o = {}) {
  const el = document.createElement("div"); el.className = "toast " + (o.cls || "");
  const m = document.createElement("div"); m.className = "tmsg"; if (o.html) m.innerHTML = msg; else m.textContent = msg; el.appendChild(m);
  const close = () => el.remove();
  actions.forEach(a => { const b = document.createElement("button"); b.textContent = a.label; b.onclick = () => { close(); a.fn(); }; el.appendChild(b); });
  if (o.sticky) { const b = document.createElement("button"); b.textContent = "✕"; b.setAttribute("aria-label", "Dismiss"); b.onclick = close; el.appendChild(b); }
  const box = $("#toasts"); box.appendChild(el); while (box.children.length > 4) box.firstChild.remove();
  if (!o.sticky) setTimeout(close, actions.length ? 7000 : 3500);
}
function copyText(text) {
  const fallback = () => { openDrawer(`${drawerHead("Weekly summary")}<p class="muted" style="margin:0">Copying isn't allowed here. Select the text below and copy it.</p><textarea id="sum-out" style="min-height:360px;width:100%;font:13px/1.5 var(--f-mono)" readonly>${esc(text)}</textarea>`, "summary"); const ta = $("#sum-out"); ta.focus(); ta.select(); };
  try { navigator.clipboard.writeText(text).then(() => toast("Summary copied. Paste it anywhere."), fallback); } catch { fallback(); }
}
function weekSummaryText(ws) {
  const we = addDays(ws, 6), ts = tasks(), inWk = d => d && d >= ws && d <= we;
  const done = ts.filter(t => inWk(doneDay(t))), left = ts.filter(t => (t.status === "todo" || t.status === "doing") && t.due && t.due <= we), blocked = ts.filter(t => t.status === "blocked");
  let focus = 0; for (let i = 0; i < 7; i++) focus += focusOn(addDays(ws, i));
  const rv = Store.get("review-" + ws) || {};
  const L = [`Week of ${fmtShort(ws)} – ${fmtShort(we)} (week ${isoWeek(parseDay(ws))})`, "",
    `DONE (${done.length})`, ...done.map(t => "  ✓ " + t.title), "",
    `STILL LEFT (${left.length})`, ...left.map(t => `  ○ ${t.title} (due ${fmtShort(t.due)})`), "",
    `BLOCKED (${blocked.length})`, ...blocked.map(t => `  ⨯ ${t.title}${t.blockedReason ? " — " + t.blockedReason : ""}`), ""];
  const gs = goals(); if (gs.length) { L.push("GOALS"); gs.forEach(g => { const s = goalStats(g); L.push(`  ${g.title}: ${Math.round(s.pct * 100)}% (${s.done}/${s.total})${g.target ? ", target " + fmtShort(g.target) : ""}, ${HEALTH[s.health][1].toLowerCase()}`); }); L.push(""); }
  L.push(`Focus time: ${fmtMin(focus)}`);
  if (rv.wins) L.push("", "What went well: " + rv.wins);
  if (rv.blockers) L.push("What got in the way: " + rv.blockers);
  if (rv.next) L.push("Focus for next week: " + rv.next);
  return L.join("\n");
}

// ---------- Claude helpers (only when this view offers them) ----------
async function aiBreakdown() {
  const t = Store.get(state.drawer && state.drawer.id); if (!t || !caps.sample) return;
  const btn = $("#d-ai"); if (btn) { btn.disabled = true; btn.textContent = "Thinking…"; }
  try {
    const r = await caps.sample.json(`You help someone finish a to-do item by splitting it into small, concrete next actions.
Task: "${t.title}"
${t.notes ? "Their notes: " + t.notes : ""}
${t.goalId && Store.get(t.goalId) ? "It's part of the goal: " + Store.get(t.goalId).title : ""}
Existing steps: ${(t.subtasks || []).map(s => s.t).join("; ") || "none"}
Return JSON only: {"steps": ["..."]} with 3 to 6 new steps. Each step starts with a verb, is under 12 words, and takes under an hour.`, { modelTier: "quick" });
    const steps = (r && Array.isArray(r.steps) ? r.steps : []).filter(s => typeof s === "string" && s.trim()).slice(0, 8);
    if (!steps.length) throw { code: "empty" };
    const cur = Store.get(t.id); cur.subtasks = [...(cur.subtasks || []), ...steps.map(s => ({ id: uid("s"), t: s.trim(), done: false }))]; Store.put(cur); refreshSubs(cur);
  } catch (e) { toast(e && e.code === "rate_limited" ? "Claude is busy. Try again in a minute." : e && e.code === "not_granted" ? "Claude access wasn't allowed for this page." : "Couldn't get steps this time. Try again."); }
  if (btn && document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = IC.spark + " Break this down into steps with Claude"; }
}
async function aiGoal(gid) {
  const g = Store.get(gid); if (!g || !caps.sample) return;
  toast("Asking Claude for next steps…");
  try {
    const s = goalStats(g);
    const r = await caps.sample.json(`You help someone reach a goal by proposing the next concrete tasks.
Goal: "${g.title}"${g.why ? "\nWhy: " + g.why : ""}${g.target ? "\nTarget date: " + g.target + " (today is " + today() + ")" : ""}
Done so far: ${s.ts.filter(t => !isOpen(t)).map(t => t.title).join("; ") || "nothing yet"}
Still open: ${s.ts.filter(isOpen).map(t => t.title).join("; ") || "nothing"}
Return JSON only: {"tasks": ["..."]} with 3 to 5 new tasks not already listed. Each starts with a verb and is under 12 words.`, { modelTier: "quick" });
    const list = (r && Array.isArray(r.tasks) ? r.tasks : []).filter(x => typeof x === "string" && x.trim()).slice(0, 6);
    if (!list.length) throw { code: "empty" };
    const made = list.map(x => newTask({ title: x.trim(), goalId: gid }));
    await Store.bulk(made);
    toast(`Added ${made.length} suggested tasks to “${g.title}”.`, [{ label: "Undo", fn: () => Store.bulk([], made.map(m => m.id)) }]);
  } catch (e) { toast(e && e.code === "rate_limited" ? "Claude is busy. Try again in a minute." : "Couldn't get suggestions this time. Try again."); }
}
async function aiCoach() {
  const ws = state.week; if (!caps.sample) return;
  state.coach[ws] = { busy: true, text: "" }; scheduleRender();
  try {
    await caps.sample(`You are a warm, practical productivity coach. Read this person's week and reply in under 170 words of plain text (no markdown headings, no bullet symbols other than "- "):
1) one sentence acknowledging what they got done,
2) the pattern you notice (what slipped, what's blocked and why),
3) three specific, small actions for next week, naming real tasks from the list.

${weekSummaryText(ws)}`, { modelTier: "default", onText: ({ text }) => { state.coach[ws] = { busy: true, text }; scheduleRender(); } })
      .then(r => { state.coach[ws] = { busy: false, text: r.text }; });
  } catch (e) { state.coach[ws] = { busy: false, text: (e && e.text) || "" }; toast(e && e.code === "rate_limited" ? "Claude is busy. Try again in a minute." : "Couldn't get a summary this time. Try again."); }
  scheduleRender();
}
